# Builds the Docker image and pushes it to Azure Container Registry.
# The studentperformancecheck web app then pulls the new :latest image through the
# ACR webhook created by Deployment Center > "Continuous deployment for the main container".

name: Build and push container to ACR - studentperformancecheck

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: testdockerniyi.azurecr.io
  IMAGE: studentperformance1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
